[project]
name = "json-pointer-utils"
version = "0.1.3"
description = "Apply RFC 6901 JSON Pointers to Python data structures without external dependencies."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
